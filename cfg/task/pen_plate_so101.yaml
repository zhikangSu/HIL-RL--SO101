task_name: pen_plate_so101
# DEFAULT = END-EFFECTOR control: position-only EE-delta [dx,dy,dz] + binary gripper, IK via
# lerobot RobotKinematics (placo). Aligned to the official lerobot SO100/SO101 end-effector
# controller: position_weight=1.0 + orientation_weight=0.01 (soft hold of the frozen reset
# orientation), and the EE target anchors to the COMMANDED pose (telescoping, no IK-residual
# drift). Matches the SiLRI/HIL-SERL EE action style (binary gripper = num_discrete_actions=2).
# Same control convention as cube_so101; only the task / dataset / classifier differ.
control_mode: pose

# xyz EE bounding box (EE bounds + obs-space bound in pose mode). Matches lerobot
# SO100FollowerEndEffectorConfig default end_effector_bounds.
abs_pose_limit_low: [-1.0, -1.0, -1.0, 0.0, 0.0, 0.0]
abs_pose_limit_high: [1.0, 1.0, 1.0, 0.0, 0.0, 0.0]

# EE mode: do NOT clamp the IK joint target (a per-joint clamp distorts the IK solution since
# only part of it would execute each tick). EE action size is bounded by so101_ee_max_delta_m.
max_relative_target: null

# SO101 reset pose: mean of initial joint state across the 20 pen_into_plate demo episodes
# (so101_cube_into_plate_v1, 480x505 cropped vertical view).
reset_joint: [0.4, -101.93, 91.3, 72.26, -4.93, 0.63]

dataset:
  repo_id: pen_plate_so101_20demo_ee_delta_state9_h2
  use_imagenet_stats: false
  # Offline replay should use complete demonstration episodes. The laptop actor
  # does not read this path during deployment; learner uses the server path.
  root: /data/users/szk/smolvla_project/data/SO101/hilrl_offline_demos/pen_plate_so101_20demo_ee_delta_state9_h2

gripper_penalty: -0.05
classifier_cfg:
  # Reward classifier trained 2026-06-03 on pen_plate_so101 (480x505 cropped vertical view),
  # 18 train ep / 2 holdout (5,15), 540/540 success/failure frames, 500 steps.
  classifier_keys: ["fixed"]
  pretrained_encoder_path: null  # using helper2424/resnet10 from HF cache, no .pkl
  checkpoint_path: /home/meow/HIL-RL--SO101/experiments/pen_plate_so101/outputs/train/2026-06-03/23-18-28_reward-classifier-pen-plate-so101/checkpoints/000500
  # Base prefix for reward-classifier frame datasets:
  # <dataset_path>_success and <dataset_path>_failure.
  dataset_path: /home/meow/HIL-RL--SO101/offline_dataset/pen_plate_so101
  reward_pos: 10.0
  reward_neg: -0.05
  require_train: false   # do not fine-tune classifier during RL
  task_name: ${task_name}
  algorithm: hil-serl
  target_hz: 15
  batch_size: 32
  enable_stacking: false
  load_classifier: ${load_classifier}

# Train gripper as part of action (not fix-gripper task like close_trashbin).
close_gripper: false
fix_gripper: false

# 15 Hz * ~16.7s = 250 steps. pen_into_plate demo duration: mean 10.8s / max 13.0s @30fps;
# 250 gives headroom over the max demo for slower early-learning policy execution.
max_episode_length: 250
# 0 = no wall-clock limit; train until operator stops (Ctrl+C) or saves on demand ('S').
max_train_time: 0

resume_model: false
resume_path: None
