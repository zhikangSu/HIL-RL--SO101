robot_config:
  robot_type: so101
  hz: 15
  # SO101 policy state is 5 arm joints (sts3215 motors in degrees) + 1 gripper
  # (RANGE_0_100 stroke %) + FK-derived end-effector xyz. The policy action is
  # position-only EE-delta: [dx, dy, dz, binary_gripper].
  joint_dim: 5
  gripper_dim: 1
  dual_arm: false
  use_cmd_pose: false

  # SO101 cameras: fixed (table-mounted, 侧装) + wrist
  # fixed: ROTATE_270 转正 → 480x640，再 image_crop 顶裁 135 → 480x505，最后 resize 128x128
  #   （与本地 record_pretty.py / SmolVLA 训练视图一致）。wrist: 640x480 直接 resize 128x128。
  image_crop:
    fixed: [[135, 640], [0, 480]]   # 旋转后 [h0:h1, w0:w1] → 高505 宽480 = 480x505
  image_keys: ["fixed", "wrist"]
  image_resize:
    "fixed": [128, 128, 3]
    "wrist": [128, 128, 3]
  bgr2rgb: false   # lerobot SOFollower already returns RGB

  # SO101 EE-delta policy scale, in meters per normalized action component.
  # These values cover the 99demo converted action distribution without clipping:
  # p99 ~= 45.7 mm, max ~= 60.2 mm.
  action_scale: [0.035, 0.030, 0.060]
  so101_ee_delta_scale_m: [0.035, 0.030, 0.060]
  so101_ee_max_delta_m: 0.08
  so101_urdf_path: assets/so101/so101_new_calib.urdf
  so101_target_frame_name: gripper_frame_link
  so101_ik_iters: 5
  # Soft orientation hold = lerobot RobotKinematics default. 0.0 left the redundant 5-DoF
  # wrist unconstrained (spun ~320 deg); 0.01 holds the frozen reset orientation while
  # position keeps weight 1.0, the standard 5-DoF position/orientation least-squares split.
  so101_ik_orientation_weight: 0.01

  # SO101 follower uses lerobot.SO101Follower (Feetech bus over USB). State still
  # contains 5 joint motors in degrees + 1 gripper motor in 0-100 stroke percent.
  # In pose mode, actions are low-dimensional xyz EE deltas plus binary gripper.

  # Proprioceptive features used by SERLObsWrapper.
  # joints=5-dim, gripper_pose=1-dim, ee_pos=3-dim -> 9-dim state.
  # ee_pos is the FK xyz of the current follower pose; quaternion is omitted.
  proprio_keys: ["joints", "gripper_pose", "ee_pos"]

  # SO101 lerobot port + calibration id (override in task yaml or via CLI per machine).
  # Laptop deployment: by-id paths bound to CH340 serials (stable across enumerate order).
  # follower CH340 serial 5C4C128258; leader CH340 serial 5C4C125442.
  so101_follower_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5C4C128258-if00"
  so101_follower_id: "so101_follower"
  so101_leader_port: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5C4C125442-if00"
  so101_leader_id: "so101_leader"

  # Cameras (lerobot OpenCV cameras). icSpring fourcc + index pinned to match SmolVLA deployment.
  # MUST match training dataset camera setup.
  so101_cameras:
    fixed:
      type: opencv
      index_or_path: "/dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0"
      # 物理侧装 → ROTATE_270 转正；width/height 填【旋转后】480x640，lerobot 内部把采集 swap 回 640x480。
      # 顶部 135px 的裁剪交给上面的 image_crop（旋转后坐标系）。
      width: 480
      height: 640
      rotation: ROTATE_270
      fps: 30
      fourcc: "MJPG"
    wrist:
      type: opencv
      index_or_path: "/dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0"
      width: 640
      height: 480
      fps: 30
      fourcc: "YUYV"

  # xyz EE bounding box. Keep broad for now; EE action scale and
  # so101_ee_max_delta_m remain the primary action-size guard.
  target_pose: ${target_pose}
  abs_pose_limit_low: ${abs_pose_limit_low}
  abs_pose_limit_high: ${abs_pose_limit_high}
  so101_ee_bounds_min: ${abs_pose_limit_low}
  so101_ee_bounds_max: ${abs_pose_limit_high}
  reset_joint: ${reset_joint}

  # Per-tick joint move cap, set per task: joint mode uses a cap (safety net for
  # absolute targets + SAC exploration), EE mode uses null (the clamp distorted
  # Z-axis IK trajectories because only part of the IK solution executed each tick).
  max_relative_target: ${max_relative_target}
  policy_action_smoothing_alpha: 0.35

  # Policy action unnormalize bounds: SAC tanh squash outputs [-1, 1], we map to physical
  # joint degree range. Derived from cube_103ep dataset min/max with ±2° safety buffer.
  # SO101Station._extract_command applies the linear map per-call.
  # cube_103ep range: min=[-33.8, -104.2, -34.5, 43.5, -43.3], max=[63.2, 42.4, 96.7, 96.4, 62.6]
  so101_joint_action_min: [-36.0, -107.0, -37.0, 41.0, -46.0]
  so101_joint_action_max: [66.0, 45.0, 99.0, 99.0, 65.0]

  # No random init for first EE-delta hardware bring-up.
  random_reset: false
  random_xy_range: 0.0
  random_rz_range: 0.0
  gripper_sleep: 0.05

  max_episode_length: ${max_episode_length}
  control_mode: ${control_mode}
  classifier_cfg: ${classifier_cfg}
  gripper_penalty: ${gripper_penalty}
  close_gripper: ${close_gripper}
  fix_gripper: ${fix_gripper}
  ego_mode: ${ego_mode}
